<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelCraft - Szybki Przegląd Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        .neon-text { text-shadow: 0 0 10px rgba(204, 255, 0, 0.5); }
        .reel-container { aspect-ratio: 9/16; position: relative; overflow: hidden; border-radius: 12px; border: 1px solid #1a1a1a; }
        .reel-container:hover { border-color: #ccff00; box-shadow: 0 0 15px rgba(204, 255, 0, 0.2); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#050505] text-white font-sans antialiased">

    <header class="py-10 text-center">
        <a href="/" class="text-2xl font-bold tracking-tighter text-[#ccff00] neon-text">ReelCraft</a>
        <h1 class="text-xl mt-2 text-gray-400">Wybrane realizacje short-form</h1>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 pb-20">
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-20">
            
            <div class="reel-container">
                <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/55KkqrIlT7w?autoplay=1&mute=1&loop=1&playlist=55KkqrIlT7w&controls=0&showinfo=0&rel=0&vq=hd1080" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="reel-container">
                <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/K-BRon7nk8o?autoplay=1&mute=1&loop=1&playlist=K-BRon7nk8o&controls=0&showinfo=0&rel=0&vq=hd1080" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="reel-container">
                <iframe class="absolute inset-0 w-full h-full" src="https://youtube.com/embed/eDD60PNKCgU?autoplay=1&mute=1&loop=1&playlist=eDD60PNKCgU&controls=0&showinfo=0&rel=0&vq=hd1080" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="reel-container">
                <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/UKTLUJ9OU8U?autoplay=1&mute=1&loop=1&playlist=UKTLUJ9OU8U&controls=0&rel=0&vq=hd1080" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="reel-container">
                <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/ID_FILMU_5?autoplay=1&mute=1&loop=1&playlist=ID_FILMU_5&controls=0&rel=0&vq=hd1080" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

        </div>

        <section id="contact" class="max-w-2xl mx-auto bg-[#0f0f0f] p-8 rounded-3xl border border-gray-800 my-20">
    <h2 class="text-3xl font-bold mb-6 text-center">Zróbmy razem <span class="text-[#ccff00]">Viral</span></h2>
    
    <form id="contact-form" class="space-y-4">
        <input type="hidden" name="access_key" value="4838d51d-62c7-4194-b454-bbf6f590814d">
        
        <div>
            <input type="text" name="name" placeholder="Twoje imię" required 
                class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-4 text-white focus:border-[#ccff00] outline-none transition-all">
        </div>
        <div>
            <input type="email" name="email" placeholder="Twój E-mail" required 
                class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-4 text-white focus:border-[#ccff00] outline-none transition-all">
        </div>
        <div>
            <textarea name="message" rows="4" placeholder="Opisz swój projekt lub podaj link do profilu..." required
                class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-4 text-white focus:border-[#ccff00] outline-none transition-all"></textarea>
        </div>

        <button type="submit" id="submit-btn"
            class="w-full bg-[#ccff00] text-black font-bold py-4 rounded-xl hover:bg-[#b3e600] transition-all transform hover:scale-[1.02] flex justify-center items-center gap-2">
            Wyślij wiadomość 🚀
        </button>

        <div id="form-message" class="hidden mt-4 p-4 bg-green-900/30 border border-green-500 text-green-400 rounded-xl text-center">
            Wiadomość wysłana! Odezwę się w ciągu 24h. 🔥
        </div>
    </form>
</section>
    </main>

    <footer class="py-10 text-center text-gray-600 text-sm">
        &copy; 2026 ReelCraft. Wszystkie prawa zastrzeżone.
    </footer>
    <script>
    // --- SMOOTH SCROLL ---
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        });
    });

    // --- FORM LOGIC (Web3Forms) ---
    const contactForm = document.getElementById('contact-form');
    const formMessage = document.getElementById('form-message');
    const submitBtn = document.getElementById('submit-btn');

    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(contactForm);
        const originalText = submitBtn.innerHTML;

        // Efekt wysyłania
        submitBtn.innerHTML = "Wysyłanie... ⏳";
        submitBtn.disabled = true;

        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                // Sukces
                formMessage.classList.remove('hidden');
                contactForm.reset();
                submitBtn.innerHTML = "Wysłano! ✅";
                
                setTimeout(() => { 
                    formMessage.classList.add('hidden');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }, 5000);
            } else {
                alert("Błąd: " + data.message);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }

        } catch (error) {
            alert("Coś poszło nie tak. Spróbuj ponownie.");
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
